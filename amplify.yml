version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use Node 20 (Next 16 + React 19 require >= 18.18; 20 is the safe target)
        - nvm install 20
        - nvm use 20
        # Enable pnpm via corepack and install with the committed lockfile
        - corepack enable
        - corepack prepare pnpm@10.33.2 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Amplify injects console env vars into the BUILD environment but NOT
        # into the Next.js SSR runtime (Lambda). Per AWS's documented workaround,
        # write the server-side vars the app reads at request time into
        # .env.production so Next.js loads them at runtime. (NEXT_PUBLIC_* are
        # already inlined at build and don't need this.)
        - env | grep -E '^(STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|CONTACT_FROM_EMAIL|CONTACT_TO_EMAIL|CONTACT_SES_REGION|YOUTUBE_API_KEY)=' >> .env.production || true
        - pnpm run build
  artifacts:
    # Next.js SSR output — Amplify's managed Next.js adapter consumes .next
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
